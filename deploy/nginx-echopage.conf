# echopage — proxy reverso com TLS.
#   1. aponte um subdomínio (ex.: api.seudominio.com) para o IP da VPS
#   2. salve isto em /etc/nginx/sites-available/echopage e ative:
#        ln -s /etc/nginx/sites-available/echopage /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
#   3. emita o certificado:
#        apt install -y certbot python3-certbot-nginx
#        certbot --nginx -d api.seudominio.com

server {
    listen 80;
    listen [::]:80;
    server_name api.seudominio.com;          # <<< troque

    # o certbot preenche o redirect para https aqui

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O log ao vivo é SSE: bufferizar mata o acompanhamento em tempo real,
        # e o timeout padrão derrubaria a conexão no meio de uma captura longa.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }
}
