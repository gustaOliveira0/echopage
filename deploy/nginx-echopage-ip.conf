# echopage — painel direto na VPS, sem domínio.
#
# O painel embutido não manda token nas chamadas dele, e um clone servido em
# /c/<nome>/ pede dezenas de assets que também não mandariam: por isso quem
# protege aqui é o Basic Auth do nginx, que o navegador repete sozinho em toda
# requisição. O painel escuta só em 127.0.0.1; a porta 80 é este bloco.
#
# Sem TLS a senha viaja em claro. Assim que houver domínio, rode o certbot.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    auth_basic "echopage";
    auth_basic_user_file /etc/nginx/echopage.htpasswd;

    client_max_body_size 1m;

    # o .zip de um clone passa de 100 MB; sem isto o nginx trunca em disco
    proxy_max_temp_file_size 0;

    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O log ao vivo é SSE: bufferizar mata o acompanhamento em tempo real,
        # e o timeout padrão derrubaria a conexão no meio de uma captura longa.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }
}
