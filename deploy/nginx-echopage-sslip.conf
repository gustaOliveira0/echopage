# echopage — API com TLS sem domínio próprio, pelo sslip.io.
#
# echopage.<ip-com-traços>.sslip.io resolve para o próprio IP, e isso basta
# para o Let's Encrypt. Não é default_server: a VPS divide o nginx com outros
# sites, e quem responde por IP puro continua sendo eles. O desafio ACME
# desta máquina já é servido pelo default_server em /var/www/html:
#   certbot certonly --webroot -w /var/www/html -d echopage.108-174-151-220.sslip.io
#
# Aberto: sem Basic Auth e sem ECHOPAGE_TOKEN no /etc/echopage.env. Quem
# achar o endereço usa o painel e manda a VPS clonar o que quiser.

server {
    listen 80;
    listen [::]:80;
    server_name echopage.108-174-151-220.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name echopage.108-174-151-220.sslip.io;
    ssl_certificate     /etc/letsencrypt/live/echopage.108-174-151-220.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/echopage.108-174-151-220.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 1m;

    # o .zip de um clone passa de 100 MB; sem isto o nginx trunca em disco
    proxy_max_temp_file_size 0;

    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O log ao vivo é SSE: bufferizar mata o acompanhamento em tempo real,
        # e o timeout padrão derrubaria a conexão no meio de uma captura longa.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }
}
